server {
    listen 80;
    server_name jonwhitmer.com www.jonwhitmer.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jonwhitmer.com www.jonwhitmer.com;

    ssl_certificate /etc/letsencrypt/live/jonwhitmer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jonwhitmer.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://portfolio-backend:8080/api/; # internal container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
